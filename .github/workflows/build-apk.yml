name: Hike APK erstellen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android SDK Pakete
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle installieren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: ZIP entpacken
        run: |
          mkdir -p build-src
          unzip -q Hike_Lernen_mit_Keno_FINAL_Cloud.zip -d build-src

      - name: Android Projekt vorbereiten
        run: |
          echo "Suche Android-Projekt..."

          PROJECT_DIR=$(dirname "$(find build-src -name settings.gradle.kts -o -name settings.gradle | head -n 1)")

          echo "Projekt gefunden: $PROJECT_DIR"

          echo "android.useAndroidX=true" > "$PROJECT_DIR/gradle.properties"

          cat > "$PROJECT_DIR/app/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "de.hike.lernenmitkeno"
              compileSdk = 35

              defaultConfig {
                  applicationId = "de.hike.lernenmitkeno"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation("androidx.datastore:datastore-preferences:1.1.1")
              implementation("com.google.mlkit:text-recognition:16.0.1")
              implementation("androidx.camera:camera-camera2:1.4.1")
              implementation("androidx.camera:camera-lifecycle:1.4.1")
              implementation("androidx.camera:camera-view:1.4.1")
          }
          EOF

      - name: APK bauen
        run: |
          PROJECT_DIR=$(dirname "$(find build-src -name settings.gradle.kts -o -name settings.gradle | head -n 1)")
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Hike APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Hike-Lernen-mit-Keno-APK
          path: build-src/**/app/build/outputs/apk/debug/app-debug.apk
