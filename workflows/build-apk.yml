name: Hike APK bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android SDK Pakete
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle installieren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: ZIP entpacken
        run: |
          mkdir -p build-src
          unzip -q Hike_Lernen_mit_Keno_FINAL_Cloud.zip -d build-src
      - name:       - name: AndroidX und JVM Ziel setzen
        run: |
          echo "android.useAndroidX=true" > build-src/gradle.properties

          cat >> build-src/app/build.gradle.kts <<'EOF'

          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)
              }
          }
          EOF
          EOF
      -      - name: APK erstellen
        run: |
          echo "Suche Gradle-Projekt..."
          find build-src -name settings.gradle.kts -o -name settings.gradle
          PROJECT_DIR=$(dirname "$(find build-src -name settings.gradle.kts -o -name settings.gradle | head -n 1)")
          echo "Projekt gefunden: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          cat > force-jvm.gradle <<'EOF'
          allprojects {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }

              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions.jvmTarget = "17"
              }
          }
          EOF

          gradle --init-script force-jvm.gradle assembleDebug --no-daemon

      - name: Hike APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Hike-Lernen-mit-Keno-APK
          path: build-src/**/app/build/outputs/apk/debug/app-debug.apk
