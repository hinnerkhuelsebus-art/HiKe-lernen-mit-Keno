name: Hike APK bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android SDK Pakete
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle installieren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: ZIP entpacken
        run: |
          mkdir -p build-src
          unzip -q Hike_Lernen_mit_Keno_FINAL_Cloud.zip -d build-src
      -       - name: AndroidX und JVM 17 aktivieren
        run: |
          echo "android.useAndroidX=true" > build-src/gradle.properties
          cat >> build-src/app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          EOF
      - name: APK bauen
        run: |
          echo "Suche Gradle-Projekt..."
          find build-src -name settings.gradle.kts -o -name settings.gradle
          PROJECT_DIR=$(dirname "$(find build-src -name settings.gradle.kts -o -name settings.gradle | head -n 1)")
          echo "Projekt gefunden: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Hike APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Hike-Lernen-mit-Keno-APK
          path: build-src/**/app/build/outputs/apk/debug/app-debug.apk
